<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Svalvolati On The Road v3 - Tour fix</title><!-- SV-V3-TOUR-TIKTOK-FIX -->
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0a0a0a;color:#fff}
header{text-align:center;padding:18px 12px 6px}.logo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #d4af37}
h1{color:#f5c542;margin:8px 0 2px;font-size:28px}h1 span{color:#ff6a00}.motto{color:#ffe9a8;letter-spacing:3px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}nav button{border:1px solid #444;background:#1c1c1c;color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700}nav button.active{background:#f5c542;color:#000}
main{max-width:1100px;margin:0 auto;padding:12px 14px 40px}.card{background:#161616;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}
h2{margin:0 0 8px}.muted{color:#bbb}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;margin:6px 0}
.btn{background:#f5c542;color:#000;border:0;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer}.btn2{background:#ff6a00;color:#fff;border:0;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#bbb}
.social{display:flex;align-items:center;gap:12px;background:#1d1d1d;border-radius:14px;padding:12px;margin:10px 0}.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900}
</style></head>
<body>
<header><img src="logo.jpg" class="logo" alt="Svalvolati On The Road"><h1>SVALVOLATI <span>ON THE ROAD</span></h1><div class="motto">Passione, Prudenza, Rispetto</div><div class="small">DUE RUOTE • STRADA • AMICI</div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const TABS=[['home','Home'],['tour','Tour'],['uscita','Uscita in giornata'],['gruppo','Gruppo'],['social','Social'],['avvisi','Avvisi']];
let tab='home'; let admin=localStorage.getItem('sv_admin')==='1';
let data=JSON.parse(localStorage.getItem('sv_data')||'{"tours":[],"uscite":[],"social":{"whatsapp":"https://chat.whatsapp.com/KhYBHsxQ0OV99EI4RN80An","instagram":"https://www.instagram.com/svalvolationtheroad2023_","tiktok":"https://www.tiktok.com/@svalvolationtheroad2023_"},"avvisi":[]}');
if(!data.social) data.social={};
if(!data.social.tiktok) data.social.tiktok="https://www.tiktok.com/@svalvolationtheroad2023_";
if(!data.social.whatsapp) data.social.whatsapp="https://chat.whatsapp.com/KhYBHsxQ0OV99EI4RN80An";
if(!data.social.instagram) data.social.instagram="https://www.instagram.com/svalvolationtheroad2023_";
function save(){localStorage.setItem('sv_data',JSON.stringify(data));render()}
function esc(s){return String(s||'').replace(/</g,'&lt;')}
function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+`<button onclick="gestione()">${admin?'Esci Gestione':'Gestione'}</button>`}
function go(t){tab=t;render()}
function gestione(){if(admin){admin=false;localStorage.removeItem('sv_admin')}else{let p=prompt('Inserisci PIN'); if(p){admin=true;localStorage.setItem('sv_admin','1')}} render()}
function partecipa(tipo,titolo){let n=prompt('Come ti chiami?'); if(!n) return alert('Scrivi il tuo nome'); let txt=`Io ci sono - ${n} - ${tipo} ${titolo}`; let wa=data.social.whatsapp||''; if(wa){window.open(wa,'_blank')} window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function render(){
 renderNav(); let m=document.getElementById('main');
 if(tab==='home'){m.innerHTML=`<div class="card"><h2>SVALVOLATI</h2><p class="muted">Benvenuti nella nostra app. Solo per il nostro gruppo.</p><p><b>Prossimi Tour:</b> ${data.tours.length||'Nessun tour - Crea il tuo primo tour'}</p><p><b>Uscite in giornata:</b> ${data.uscite.length||'Nessuna uscita'}</p></div>`+data.tours.map((t,i)=>`<div class="card"><h3>${esc(t.titolo)}</h3><div class="small">${esc(t.dataInizio||t.data||'')} ${t.dataFine?`→ ${esc(t.dataFine)} `:''}${t.durata?`• ${esc(t.durata)} `:''}• ${esc((t.tappe||[]).join(' - '))}</div><div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipa('Tour','${esc(t.titolo)}')">PARTECIPA</button>${admin?`<button class="btn" onclick="delTour(${i})">Elimina</button>`:''}</div></div>`).join('')}
 else if(tab==='tour'){m.innerHTML=`<div class="card"><h2>Tour</h2><div class="small" style="color:#f5c542">Versione nuova — Data inizio / Data fine / Durata / Tappe singole</div>${admin?`<input id="tt" placeholder="Titolo tour"><label class="small">Data inizio — puoi scrivere con / oppure - (es. 20/06/2026 o 20-06-2026)</label><input id="tdi" type="text" inputmode="text" placeholder="Data inizio — GG/MM/AAAA"><label class="small">Data fine — puoi scrivere con / oppure -</label><input id="tdf" type="text" inputmode="text" placeholder="Data fine — GG/MM/AAAA"><label class="small">Durata</label><input id="tdu" type="text" placeholder="Durata — es. 3 giorni"><label class="small">Tappe singole — una alla volta</label><div id="tappeBox"></div><div class="row"><input id="tappaNuova" type="text" placeholder="Scrivi una tappa e tocca + Aggiungi Tappa" style="flex:1"><button class="btn" type="button" onclick="addTappaInput()">+ Aggiungi Tappa</button></div><div class="row" style="margin-top:10px"><button class="btn" onclick="addTour()">+ Crea Tour</button></div>`:''}</div>`+ (data.tours.length?data.tours.map((t,i)=>`<div class="card"><h3>${esc(t.titolo)}</h3><div><b>${esc(t.dataInizio||'')}</b>${t.dataFine?` → <b>${esc(t.dataFine)}</b>`:''} ${t.durata?`• ${esc(t.durata)}`:''}</div><div class="small">Tappe: ${esc((t.tappe||[]).join(' → '))}</div><div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipaTour(${i})">PARTECIPA</button>${admin?`<button class="btn" onclick="delTour(${i})">Elimina</button>`:''}</div></div>`).join(''):`<div class="card">Nessun tour - Crea il tuo primo tour</div>`); if(admin) renderTappeBox();}
 else if(tab==='uscita'){m.innerHTML=`<div class="card"><h2>Uscita in giornata</h2>${admin?`<input id="ud" placeholder="Destinazione"><input id="udt" placeholder="GG/MM/AAAA"><input id="uo" placeholder="Orario ritrovo"><input id="ul" placeholder="Luogo ritrovo"><button class="btn" onclick="addUscita()">+ Crea Uscita</button>`:''}</div>`+(data.uscite.length?data.uscite.map((u,i)=>`<div class="card"><h3>${esc(u.dest)}</h3><div>${esc(u.data)} • ${esc(u.orario)} • ${esc(u.luogo)}</div><div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipa('Uscita in giornata','${esc(u.dest)}')">PARTECIPA</button>${admin?`<button class="btn" onclick="delUscita(${i})">Elimina</button>`:''}</div></div>`).join(''):`<div class="card">Nessuna uscita in giornata</div>`)}
 else if(tab==='gruppo'){m.innerHTML=`<div class="card"><h2>Gruppo</h2><p>Il nostro gruppo Svalvolati. Solo noi.</p><p class="muted">Per partecipare tocca PARTECIPA nei Tour o nelle Uscite e scrivi il tuo nome.</p></div>`}
 else if(tab==='social'){let s=data.social; m.innerHTML=`<div class="card"><h2>Social</h2>
  <div class="social"><div class="dot" style="background:#25D366">☎</div><div style="flex:1"><b>WhatsApp</b><div class="small">${s.whatsapp?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('whatsapp')">APRI</button></div>
  <div class="social"><div class="dot" style="background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)">◎</div><div style="flex:1"><b>Instagram</b><div class="small">${s.instagram?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('instagram')">APRI</button></div>
  <div class="social"><div class="dot" style="background:#000;border:1px solid #fff">♪</div><div style="flex:1"><b>TikTok</b><div class="small">${s.tiktok?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('tiktok')">APRI</button></div>
  ${admin?`<div class="card"><h3>Modifica link (solo tu)</h3><input id="sw" placeholder="Link WhatsApp"><input id="si" placeholder="Link Instagram"><input id="st" placeholder="Link TikTok"><button class="btn" onclick="saveSocial()">Salva link</button><p class="small">Dopo il salvataggio i link non si vedono più, resta solo APRI.</p></div>`:''}
 </div>`}
 else if(tab==='avvisi'){m.innerHTML=`<div class="card"><h2>Avvisi</h2>${admin?`<textarea id="av" placeholder="Scrivi un avviso"></textarea><button class="btn" onclick="addAvviso()">+ Aggiungi Avviso</button>`:''}</div>`+(data.avvisi.map((a,i)=>`<div class="card">${esc(a)} ${admin?`<button class="btn" onclick="delAvviso(${i})">Elimina</button>`:''}</div>`).join('')||'<div class="card">Nessun avviso</div>')}
}
let tappeTemp=[];
function renderTappeBox(){let b=document.getElementById('tappeBox'); if(!b) return; b.innerHTML=tappeTemp.map((tp,ix)=>`<div class="row" style="align-items:center;background:#222;border-radius:10px;padding:8px 10px;margin:6px 0"><span style="flex:1">${ix+1}. ${esc(tp)}</span><button class="btn" type="button" onclick="delTappaInput(${ix})" style="padding:6px 12px">X</button></div>`).join('') || '<div class="small">Nessuna tappa ancora. Aggiungi la prima tappa.</div>';}
function addTappaInput(){let el=document.getElementById('tappaNuova'); let v=(el.value||'').trim(); if(!v) return alert('Scrivi la tappa'); tappeTemp.push(v); el.value=''; renderTappeBox(); el.focus();}
function delTappaInput(ix){tappeTemp.splice(ix,1); renderTappeBox();}
function partecipaTour(i){let t=data.tours[i]; let n=prompt('Come ti chiami?'); if(!n) return alert('Scrivi il tuo nome'); let tappe=(t.tappe||[]).map((x,ix)=>(ix+1)+'. '+x).join('\n'); let txt=`Io ci sono - ${n} - Tour ${t.titolo} ${t.dataInizio||''}${t.dataFine?' - '+t.dataFine:''}${t.durata?' - '+t.durata:''}\nTappe:\n${tappe}`; let wa=data.social.whatsapp||''; if(wa){window.open(wa,'_blank')} window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function addTour(){let t=document.getElementById('tt').value.trim(); if(!t) return alert('Scrivi il titolo'); let di=document.getElementById('tdi').value.trim(); let df=document.getElementById('tdf').value.trim(); let du=document.getElementById('tdu').value.trim(); data.tours.push({titolo:t,dataInizio:di,dataFine:df,durata:du,data:di,tappe:[...tappeTemp]}); tappeTemp=[]; save(); alert('Tour salvato')}
function addUscita(){let d=document.getElementById('ud').value.trim(); if(!d) return alert('Scrivi la destinazione'); data.uscite.push({dest:d,data:document.getElementById('udt').value,orario:document.getElementById('uo').value,luogo:document.getElementById('ul').value}); save(); alert('Uscita salvata')}
function delTour(i){if(confirm('Eliminare questo tour?')){data.tours.splice(i,1);save()}}
function delUscita(i){if(confirm('Eliminare questa uscita?')){data.uscite.splice(i,1);save()}}
function addAvviso(){let v=document.getElementById('av').value.trim(); if(!v) return; data.avvisi.push(v); save()}
function delAvviso(i){data.avvisi.splice(i,1);save()}
function normTikTok(v){v=(v||'').trim(); if(!v) return 'https://www.tiktok.com/@svalvolationtheroad2023_'; if(v.startsWith('@')) return 'https://www.tiktok.com/'+v; if(v.startsWith('http')) return v; if(v.indexOf('tiktok.com')>-1) return 'https://'+v; return 'https://www.tiktok.com/'+v.replace(/^@/, '');}
function apri(k){let u=(data.social[k]||'').trim(); if(k==='tiktok') u=normTikTok(u); if(!u) return alert('Link non ancora caricato - chiedi a Ivan'); if(!u.startsWith('http')) u='https://'+u; window.open(u,'_blank')}
function saveSocial(){let w=document.getElementById('sw').value.trim(), i=document.getElementById('si').value.trim(), t=document.getElementById('st').value.trim(); if(w) data.social.whatsapp=w.startsWith('http')?w:'https://'+w; if(i) data.social.instagram=i.startsWith('http')?i:'https://'+i; if(t){ data.social.tiktok=normTikTok(t) } save(); alert('Link salvati - ora nascosti, resta solo APRI')}
render();
</script></body></html>
