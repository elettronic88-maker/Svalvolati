lvolati On The Road" onerror="this.onerror=null;this.src='logo.jpg'"><h1>SVALVOLATI <span>ON THE ROAD</span></h1><div class="motto">Passione, Prudenza, Rispetto</div><div class="small">DUE RUOTE &bull; STRADA &bull; AMICI</div></header>

<script>

function render(){
 renderNav(); let m=document.getElementById('main');
 if(tab==='home'){m.innerHTML=`<div class="card"><h2>SVALVOLATI</h2><p class="muted">Benvenuti nella nostra app. Solo per il nostro gruppo.</p><p><b>Prossimi Tour:</b> ${data.tours.length||'Nessun tour - Crea il tuo primo tour'}</p><p><b>Uscite in giornata:</b> ${data.uscite.length||'Nessuna uscita'}</p></div>`+data.tours.map((t,i)=>`<div class="card"><h3>${esc(t.titolo)}</h3><div class="small">${esc(t.dataInizio||'')} ${t.dataFine?`&rarr; ${esc(t.dataFine)} `:''}${t.durata?`&bull; ${esc(t.durata)} `:''}&bull; ${esc((t.tappe||[]).join(' - '))}</div><div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipaTour(${i})">PARTECIPA</button>${admin?`<button class="btn" onclick="delTour(${i})">Elimina</button>`:''}</div></div>`).join('')}
 else if(tab==='tour'){m.innerHTML=`<div class="card"><h2>Tour</h2><div class="small" style="color:#f5c542">Versione V4 — Logo vero + Data inizio / Data fine / Durata / Tappe singole</div>${admin?`<input id="tt" placeholder="Titolo tour"><label class="small">Data inizio — puoi scrivere con / oppure - (es. 20/06/2026 o 20-06-2026)</label><input id="tdi" type="text" placeholder="Data inizio — GG/MM/AAAA"><label class="small">Data fine — puoi scrivere con / oppure -</label><input id="tdf" type="text" placeholder="Data fine — GG/MM/AAAA"><label class="small">Durata</label><input id="tdu" type="text" placeholder="Durata — es. 3 giorni"><label class="small">Tappe singole — una alla volta</label><div id="tappeBox"></div><div class="row"><input id="tappaNuova" type="text" placeholder="Scrivi una tappa e tocca + Aggiungi Tappa" style="flex:1"><button class="btn" type="button" onclick="addTappaInput()">+ Aggiungi Tappa</button></div><div class="row" style="margin-top:10px"><button class="btn" onclick="addTour()">+ Crea Tour</button></div>`:''}</div>`+(data.tours.length?data.tours.map((t,i)=>`<div class="card"><h3>${esc(t.titolo)}</h3><div><b>${esc(t.dataInizio||'')}</b>${t.dataFine?` &rarr; <b>${esc(t.dataFine)}</b>`:''} ${t.durata?`&bull; ${esc(t.durata)}`:''}</div><div class="small">Tappe: ${esc((t.tappe||[]).join(' &rarr; '))}</div><div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipaTour(${i})">PARTECIPA</button>${admin?`<button class="btn" onclick="delTour(${i})">Elimina</button>`:''}</div></div>`).join(''):`<div class="card">Nessun tour - Crea il tuo primo tour</div>`); if(admin) renderTappeBox();}
 else if(tab==='uscita'){m.innerHTML=`<div class="card"><h2>Uscita in giornata</h2>${admin?`<input id="ud" placeholder="Destinazione"><input id="udt" placeholder="Data — GG/MM/AAAA"><input id="uo" placeholder="Orario ritrovo — es. 08:30"><input id="ul" placeholder="Luogo ritrovo"><input id="un" placeholder="Note (facoltativo)"><button class="btn" onclick="addUscita()">+ Crea Uscita</button>`:''}</div>`+(data.uscite.length?data.uscite.map((u,i)=>`<div class="card"><h3>${esc(u.dest)}</h3><div>${esc(u.data)} &bull; ${esc(u.orario)} &bull; ${esc(u.luogo)}</div>${u.note?`<div class="small">${esc(u.note)}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn2" onclick="partecipaUscita(${i})">PARTECIPA</button>${admin?`<button class="btn" onclick="delUscita(${i})">Elimina</button>`:''}</div></div>`).join(''):`<div class="card">Nessuna uscita in giornata</div>`)}
 else if(tab==='gruppo'){m.innerHTML=`<div class="card"><h2>Gruppo</h2><p>Il nostro gruppo Svalvolati. Solo noi.</p><p class="muted">Per partecipare tocca PARTECIPA nei Tour o nelle Uscite e scrivi il tuo nome.</p></div>`}
 else if(tab==='social'){let s=data.social; m.innerHTML=`<div class="card"><h2>Social</h2><div class="social"><div class="dot" style="background:#25D366">\u260e</div><div style="flex:1"><b>WhatsApp</b><div class="small">${s.whatsapp?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('whatsapp')">APRI</button></div><div class="social"><div class="dot" style="background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)">\u25ce</div><div style="flex:1"><b>Instagram</b><div class="small">${s.instagram?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('instagram')">APRI</button></div><div class="social"><div class="dot" style="background:#000;border:1px solid #fff">\u266a</div><div style="flex:1"><b>TikTok</b><div class="small">${s.tiktok?'Link salvato':'Presto'}</div></div><button class="btn2" onclick="apri('tiktok')">APRI</button></div>${admin?`<div class="card"><h3>Modifica link (solo tu)</h3><input id="sw" placeholder="Link WhatsApp"><input id="si" placeholder="Link Instagram"><input id="st" placeholder="Link TikTok"><button class="btn" onclick="saveSocial()">Salva link</button><p class="small">Dopo il salvataggio i link non si vedono piu, resta solo APRI.</p></div>`:''}</div>`}
 else if(tab==='avvisi'){m.innerHTML=`<div class="card"><h2>Avvisi</h2>${admin?`<textarea id="av" placeholder="Scrivi un avviso"></textarea><button class="btn" onclick="addAvviso()">+ Aggiungi Avviso</button>`:''}</div>`+(data.avvisi.map((a,i)=>`<div class="card">${esc(a)} ${admin?`<button class="btn" onclick="delAvviso(${i})">Elimina</button>`:''}</div>`).join('')||'<div class="card">Nessun avviso</div>')}
}
let tappeTemp=[];
function renderTappeBox(){let b=document.getElementById('tappeBox'); if(!b) return; b.innerHTML=tappeTemp.map((tp,ix)=>`<div class="row" style="background:#222;border-radius:10px;padding:8px 10px;margin:6px 0"><span style="flex:1">${ix+1}. ${esc(tp)}</span><button class="btn" type="button" onclick="delTappaInput(${ix})" style="padding:6px 12px">X</button></div>`).join('')||'<div class="small">Nessuna tappa ancora. Aggiungi la prima tappa.</div>';}
function addTappaInput(){let el=document.getElementById('tappaNuova'); let v=(el.value||'').trim(); if(!v) return alert('Scrivi la tappa'); tappeTemp.push(v); el.value=''; renderTappeBox(); el.focus();}
function delTappaInput(ix){tappeTemp.splice(ix,1); renderTappeBox();}
function addTour(){let t=document.getElementById('tt').value.trim(); if(!t) return alert('Scrivi il titolo'); let di=document.getElementById('tdi').value.trim(); let df=document.getElementById('tdf').value.trim(); let du=document.getElementById('tdu').value.trim(); data.tours.push({titolo:t,dataInizio:di,dataFine:df,durata:du,data:di,tappe:[...tappeTemp]}); tappeTemp=[]; save(); alert('Tour salvato')}
function addUscita(){let d=document.getElementById('ud').value.trim(); if(!d) return alert('Scrivi la destinazione'); data.uscite.push({dest:d,data:document.getElementById('udt').value,orario:document.getElementById('uo').value,luogo:document.getElementById('ul').value,note:document.getElementById('un').value}); save(); alert('Uscita salvata')}
function delTour(i){if(confirm('Eliminare questo tour?')){data.tours.splice(i,1);save()}}
function delUscita(i){if(confirm('Eliminare questa uscita?')){data.uscite.splice(i,1);save()}}
function addAvviso(){let v=document.getElementById('av').value.trim(); if(!v) return; data.avvisi.push(v); save()}
function delAvviso(i){data.avvisi.splice(i,1);save()}
function saveSocial(){let w=document.getElementById('sw').value.trim(), i=document.getElementById('si').value.trim(), t=document.getElementById('st').value.trim(); if(w) data.social.whatsapp=w.startsWith('http')?w:'https://'+w; if(i) data.social.instagram=i.startsWith('http')?i:'https://'+i; if(t) data.social.tiktok=normTikTok(t); save(); alert('Link salvati - ora nascosti, resta solo APRI')}
render();
